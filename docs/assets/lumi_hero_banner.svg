<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a1124"/>
      <stop offset="100%" stop-color="#06181f"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>

  <!-- Top & Bottom Cyber HUD Borders -->
  <path d="M 30 16 L 320 16 L 340 28 L 860 28 L 880 16 L 1170 16" fill="none" stroke="url(#cyanNeon)" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 30 364 L 420 364 L 440 352 L 760 352 L 780 364 L 1170 364" fill="none" stroke="url(#cyanNeon)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Left Arc Reactor Core -->
  <circle cx="200" cy="190" r="145" fill="url(#orbGlow)"/>
  <circle cx="200" cy="190" r="95" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="14 8" stroke-opacity="0.5"/>
  <circle cx="200" cy="190" r="74" fill="none" stroke="#00ff87" stroke-width="2" stroke-dasharray="45 15 10 15" stroke-opacity="0.8"/>
  <circle cx="200" cy="190" r="52" fill="none" stroke="url(#purpleNeon)" stroke-width="2.5"/>
  <polygon points="200,158 228,190 200,222 172,190" fill="#00f2fe" fill-opacity="0.2" stroke="#00ffaa" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="200" cy="190" r="8" fill="#ffffff" filter="url(#glow)"/>

  <!-- HUD Telemetry Labels around Orb -->
  <text x="160" y="75" fill="#00ffaa" font-family="Consolas, monospace" font-size="11" letter-spacing="2">CORE // OMEGA-28</text>
  <text x="152" y="315" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" letter-spacing="1.5">LOCAL + CLOUD ROUTER</text>

  <!-- Main Title & Branding -->
  <text x="360" y="92" fill="#00ffaa" font-family="Consolas, monospace" font-size="13" font-weight="bold" letter-spacing="3.5">
    ⚡ SOVEREIGN PERSONAL AI OPERATING SYSTEM · PHASES 1–28 COMPLETE
  </text>

  <text x="358" y="162" fill="#ffffff" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="68" font-weight="900" letter-spacing="2">
    LUMI-OS
  </text>
  <text x="685" y="162" fill="url(#cyanNeon)" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="1">
    v28.0 OMEGA
  </text>

  <text x="360" y="204" fill="#cbd5e1" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="19" font-weight="400">
    Autonomous Multi-Agent Swarm · Cyber-Sentinel AST VAPT · MCTS Deep Reasoner
  </text>
  <text x="360" y="232" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16" font-weight="400">
    Counterfactual World-Model Sandbox · Topological Wave DAG · Temporal Knowledge Graph · Neural Voice HUD
  </text>

  <!-- Feature Pills -->
  <g transform="translate(360, 262)">
    <rect x="0" y="0" width="175" height="36" rx="8" fill="#0f172a" stroke="#00ffaa" stroke-width="1.2"/>
    <text x="87" y="23" text-anchor="middle" fill="#00ffaa" font-family="Consolas, monospace" font-size="13" font-weight="bold">68+ SOVEREIGN TOOLS</text>

    <rect x="190" y="0" width="185" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="282" y="23" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="bold">201/201 TESTS PASS</text>

    <rect x="390" y="0" width="190" height="36" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
    <text x="485" y="23" text-anchor="middle" fill="#c084fc" font-family="Consolas, monospace" font-size="13" font-weight="bold">4-WAY BRAIN ROUTER</text>

    <rect x="595" y="0" width="195" height="36" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="692" y="23" text-anchor="middle" fill="#fbbf24" font-family="Consolas, monospace" font-size="13" font-weight="bold">ZERO-TRUST TAINT GATE</text>
  </g>

  <!-- Bottom Status Strip -->
  <text x="360" y="330" fill="#64748b" font-family="Consolas, monospace" font-size="12" letter-spacing="1">
    [BRAIN: HERMES-3 / QWEN-3 / LOCAL-HF / NVIDIA-NIM]   ·   [VAPT: CWE + CVSS v3.1 AUTO-PATCH]   ·   [UI: OMNI-COCKPIT HUD]
  </text>
</svg>
